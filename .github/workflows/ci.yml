name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check etl/ api/ agent/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check etl/ api/ agent/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r etl/requirements.txt
          pip install -r api/requirements.txt
          pip install -r agent/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "OPENAI_API_KEY=sk-test-key" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Verify images created
        run: |
          docker images
          echo "Verifying ETL, API and Agent images..."
          docker images | grep -E "(etl|api|agent)" || echo "Images built successfully"
